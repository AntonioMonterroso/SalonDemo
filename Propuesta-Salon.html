<style>
:root { --ease: cubic-bezier(0.23, 1, 0.32, 1); --r: 24px; --gutter: 20px; --sombra: 0 1px 2px rgba(40,26,20,.04), 0 12px 36px rgba(40,26,20,.07);

.sec.osc { background: radial-gradient(42% 60% at 12% 18%, color-mix(in srgb, var(--i1) 38%, transparent), transparent 70%), radial-gradient(42% 60% at 88% 82%, color-mix(in srgb, var(--i2) 40%, transparent), transparent 70%), radial-gradient(30% 45% at 70% 10%, color-mix(in srgb, var(--i3) 28%, transparent), transparent 70%), var(--oscuro); color: var(--fondo); } .sec.osc .tx2, .sec.osc .tenue { color: color-mix(in srgb, var(--fondo) 70%, transparent); } .sec.osc .eyebrow { color: var(--t1); } .sec.osc h2 em { color: var(--t1); }

.barra-in { max-width: 1160px; margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; min-height: 60px; }

.barra-in nav a.on { background: var(--tarjeta); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.pal-punto { width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer; background: conic-gradient(var(--acento) 0 33%, var(--t1) 0 66%, var(--t2) 0); box-shadow: 0 0 0 2px var(--fondo), 0 0 0 3px var(--linea); flex: none; }
.btn-ic { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--tinta) 6%, transparent); color: var(--tinta); cursor: pointer; flex: none; transition: transform .16s var(--ease); }

.aviso { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; background: var(--oscuro); color: var(--fondo); padding: 12px 20px; border-radius: 999px; font-weight: 500; font-size: 14.5px; transition: opacity .25s var(--ease), transform .35s var(--ease); z-index: 60; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.2); }

/* portada */
.portada { position: relative; overflow: hidden; }
.portada::before { content: ""; position: absolute; inset: 0; background: radial-gradient(45% 55% at 85% 25%, var(--t1), transparent 70%), radial-gradient(40% 50% at 65% 90%, var(--t2), transparent 70%), radial-gradient(35% 45% at 5% 5%, var(--t4), transparent 70%), radial-gradient(30% 40% at 30% 95%, var(--t3), transparent 70%); }
.portada-in { position: relative; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 26px var(--gutter) 32px; max-width: 1160px; margin: 0 auto; }
.firma-top { display: flex; align-items: center; gap: 12px; }

.abanico { display: grid; gap: 14px; justify-items: center; }

aplicarTema(false);
function calcular() {
  const f = +$("cFaltas").value, t = +$("cTicket").value, m = +$("cMsj").value;
  const perdida = f * t * 4.33, recupera = perdida * .5, horas = Math.round(m * 2 * 26 / 60), costo = conIva(P.generico ? 1500 : COMBO.mes);
  $("oFaltas").textContent = f; $("oTicket").textContent = Q(t); $("oMsj").textContent = m;
  $("rPerdida").textContent = Q(perdida); $("rRecupera").textContent = Q(recupera); $("rHoras").textContent = horas + " h"; $("rCosto").textContent = Q(costo);
  $("rCostoN").textContent = P.generico ? "Paquete Boutique al mes" : "Esencial + tarjeta al mes";
  const n = t ? Math.ceil(costo / t) : 0; $("rPaga").textContent = n + (n === 1 ? " falta evitada" : " faltas evitadas");
}
["cFaltas", "cTicket", "cMsj"].forEach(id => $(id).addEventListener("input", calcular));
function refrescar() {
  $("paquetesBox").innerHTML = paquetesHTML(); $("extrasBox").innerHTML = extrasHTML(); $("comboBox").innerHTML = comboHTML();
  $("compraP").textContent = Q(conIva(28000)) + " – " + Q(conIva(35000)); $("compraM").textContent = "+ " + Q(conIva(600)) + " al mes de mantenimiento";
  calcular(); $("planBox").innerHTML = planHTML();
}
refrescar();
$("planBox").addEventListener("click", e => {
  const b = e.target.closest("[data-paq]"); if (b) { PL.paq = b.dataset.paq; $("planBox").innerHTML = planHTML(); return; }
  if (e.target.closest("[data-copiar]")) navigator.clipboard && navigator.clipboard.writeText(textoPlan(calcPlan())).then(() => aviso("Resumen copiado"), () => aviso("No se pudo copiar"));
});
$("planBox").addEventListener("change", e => {
  const k = e.target.dataset.op; if (!k) return;
  if (k === "iva") { IVA = e.target.checked; refrescar(); return; }
  PL[k] = e.target.checked; $("planBox").innerHTML = planHTML();
});
/* colores */
$("paletas").addEventListener("click", e => {
  const b = e.target.closest("[data-pal]"); if (!b) return;
  if (b.dataset.pal === "propio") { const base = temaActual(); TEMA = { id: "propio", nombre: "A tu gusto", c: Object.assign({}, base.c), t: base.t.slice(), i: (base.i || []).slice() }; }
  else TEMA = { id: b.dataset.pal };
  aplicarTema(true); $("paletas").innerHTML = paletasHTML(); $("planBox").innerHTML = planHTML(); aviso("Colores: " + temaActual().nombre);
});
$("paletas").addEventListener("input", e => {
  const k = e.target.dataset.color; if (!k) return;
  if (TEMA.id !== "propio") { const base = temaActual(); TEMA = { id: "propio", nombre: "A tu gusto", c: Object.assign({}, base.c), t: base.t.slice(), i: (base.i || []).slice() }; }
  TEMA.c[k] = e.target.value;
  if (k === "acento") { TEMA.c.acentoTexto = mezcla(e.target.value, "#000000", .42); TEMA.c.acentoSuave = mezcla(e.target.value, "#FFFFFF", .8); TEMA.t = tonos(e.target.value); TEMA.i = tintas(e.target.value); }
  if (k === "fondo") { TEMA.c.fondo2 = mezcla(e.target.value, "#000000", .045); TEMA.c.linea = mezcla(e.target.value, "#000000", .1); }
  e.target.closest(".campo-color").style.setProperty("--c", e.target.value);
  aplicarTema(true);
  document.querySelectorAll(".paleta").forEach(x => x.classList.toggle("on", x.dataset.pal === "propio"));
});
$("paletas").addEventListener("change", e => { if (e.target.dataset.color) $("planBox").innerHTML = planHTML(); });
/* abanico */
pintarAbanico(); abrirAbanico();
$("abanico").addEventListener("click", e => {
  const p = e.target.closest(".punta"); if (p) { const i = +p.dataset.i; SEL = SEL === i ? null : i; pintarAbanico(); animarAbanico(); return; }
  const t = e.target.closest("[data-tono]"); if (t) { (SEL === null ? UN : [UN[SEL]]).forEach(u => u.c = t.dataset.tono); pintarAbanico(); return; }
  const a = e.target.closest("[data-acab]"); if (a) { (SEL === null ? UN : [UN[SEL]]).forEach(u => u.a = a.dataset.acab); pintarAbanico(); return; }
  if (e.target.closest("[data-todas]")) { SEL = null; pintarAbanico(); animarAbanico(); }
});
$("abanico").addEventListener("keydown", e => { const p = e.target.closest(".punta"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); p.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
document.addEventListener("click", e => { if (e.target.closest("[data-compartir]")) compartir(); });

/* ---------- tablet + teléfono en vivo ---------- */
const VIVO = { tablet: { w: 1180, h: 820 }, tel: { w: 390, h: 800 } };
try { sessionStorage.setItem(M.clave + ".pin.recepcion", "1"); } catch (e) {}
function escalar() {
  [["fTablet", "pTablet", VIVO.tablet, 0], ["fTel", "pTel", VIVO.tel, 34]].forEach(([fi, pi, d, extra]) => {
    const f = $(fi), p = $(pi); if (!f || !p) return; const s = p.clientWidth / d.w;
    f.style.width = d.w + "px"; f.style.height = d.h + "px"; f.style.transform = `scale(${s})`; p.style.height = (d.h * s + extra) + "px";
  });
}
addEventListener("resize", escalar);
const leer = () => { try { return JSON.parse(localStorage.getItem(M.clave + ".datos")); } catch (e) { return null; } };
const ESTADO = { reservada: "Por confirmar", confirmada: "Confirmada", llego: "En espera", en_servicio: "En servicio", terminada: "Por cobrar", pagada: "Pagada", cancelada: "Cancelada", falta: "No vino" };
const horaTx = t => { const d = new Date(t), h = d.getHours(); return (h % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0") + (h < 12 ? " a. m." : " p. m."); };
let SNAP = null, VIGILA = null, SELLOS = null;
function noti(donde, titulo, sub) {
  const n = $(donde === "tablet" ? "nTablet" : "nTel"); if (!n) return;
  n.innerHTML = `<span class="ic">${esc((M.monograma || "S").slice(0, 2))}</span><span><b>${esc(titulo)}</b><small>${esc(sub)}</small></span>`;
  n.classList.add("on"); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove("on"), 4200);
  const c = $("cable"); c.classList.add("pulso"); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("pulso"), 2500);
}
function sincronizar() {
  const d = leer(); if (!d) return;
  const mapa = {}; d.citas.forEach(c => mapa[c.id] = c.estado);
  if (SNAP) d.citas.forEach(c => {
    const k = d.clientas.find(x => x.id === c.clienta_id) || { nombre: "Clienta" };
    if (!(c.id in SNAP)) { if (c.origen === "en_linea") { VIGILA = c.codigo; noti("tablet", "Nueva reserva en línea", `${k.nombre.split(" ")[0]} · ${new Date(c.ini).toDateString() === new Date().toDateString() ? "hoy" : "otro día"} ${horaTx(c.ini)}`); } }
    else if (SNAP[c.id] !== c.estado && c.codigo === VIGILA) noti("tel", "Tu cita se actualizó", `${ESTADO[c.estado] || c.estado} · ${M.nombre}`);
    else if (SNAP[c.id] !== c.estado) noti("tablet", ESTADO[c.estado] || "Actualizada", k.nombre);
  });
  const w = VIGILA && d.citas.find(c => c.codigo === VIGILA), kw = w && d.clientas.find(x => x.id === w.clienta_id);
  if (kw && SELLOS !== null && (kw.sellos || 0) !== SELLOS) noti("tel", "¡Sumaste un sello!", `${kw.sellos || 0} de ${(d.config.lealtad || { sellos: 8 }).sellos} en tu tarjeta`);
  SELLOS = kw ? (kw.sellos || 0) : null;
  SNAP = mapa;
}
const canalVivo = "BroadcastChannel" in window ? new BroadcastChannel(M.clave + ".datos") : null;
canalVivo && (canalVivo.onmessage = () => sincronizar());
addEventListener("storage", e => { if (e.key === M.clave + ".datos") sincronizar(); });
const PISTAS = [
  "Empieza en el teléfono: escoge un servicio, una hora de hoy y confirma.",
  "Mira la tablet: la reserva entra con un aviso. Si fue para hoy, aparece en «Por llegar».",
  "Toca <b>«Llegó»</b> en la tarjeta de la clienta en la tablet. El pase del teléfono cambia solo.",
  "Toca <b>«Empezar»</b>, luego <b>«Terminar»</b> y <b>«Cobrar»</b> en la tablet. Al cobrar, el teléfono suma el sello."
];
function irPaso(i) {
  document.querySelectorAll(".paso-b").forEach(b => b.classList.toggle("on", +b.dataset.paso === i));
  $("pista").innerHTML = PISTAS[i];
  const tel = $("fTel"), tab = $("fTablet"), d = leer();
  const ir = (f, h) => { try { f.contentWindow.location.hash = h; } catch (e) { f.src = "index.html" + h; } };
  if (i === 0) ir(tel, "#/reservar");
  if (i === 1) ir(tab, "#/recepcion");
  if (i >= 2 && d) {
    const h0 = new Date(); h0.setHours(0, 0, 0, 0);
    const esHoy = x => x.ini >= +h0 && x.ini < +h0 + 864e5;
    let c = VIGILA && d.citas.find(x => x.codigo === VIGILA && esHoy(x));
    if (!c) c = d.citas.filter(x => esHoy(x) && ["reservada", "confirmada", "llego"].includes(x.estado)).sort((a, b) => a.ini - b.ini)[0];
    if (c) {
      VIGILA = c.codigo; const k = d.clientas.find(x => x.id === c.clienta_id) || { nombre: "la clienta" };
      SELLOS = k.sellos || 0;
      ir(tab, "#/recepcion");
      if (i === 2) { ir(tel, "#/mi-cita/" + c.codigo); $("pista").innerHTML = `Busca a <b>${esc(k.nombre.split(" ")[0])}</b> en la tablet y toca <b>«Llegó»</b>. Su pase en el teléfono cambia solo.`; }
      if (i === 3) ir(tel, k.tarjeta ? "#/tarjeta/" + k.tarjeta : "#/mi-cita/" + c.codigo);
    } else $("pista").innerHTML = "No hay citas para hoy todavía: reserva una en el teléfono (paso 1) y vuelve aquí.";
  }
}
$("pasos").addEventListener("click", e => { const b = e.target.closest("[data-paso]"); if (b) irPaso(+b.dataset.paso); });
const ioVivo = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { ioVivo.disconnect(); $("fTablet").src = "index.html#/recepcion"; $("fTel").src = "index.html#/reservar"; escalar(); sincronizar(); } }, { rootMargin: "400px" });
ioVivo.observe($("pruebalo"));
["fTablet", "fTel"].forEach(id => $(id).addEventListener("load", () => { aplicarTema(false); escalar(); }));
escalar();

/* ---------- barra, índice, frase y apariciones ---------- */
const barra = $("barraTop"), portada = document.querySelector(".portada"), indice = $("indice");
function alDesplazar() {
  const y = scrollY, h = document.documentElement.scrollHeight - innerHeight, pasado = y > portada.offsetHeight * .7;
  barra.classList.toggle("on", pasado); indice.classList.toggle("on", pasado);
  let act = null; document.querySelectorAll("main section[id]").forEach(s => { if (s.getBoundingClientRect().top < innerHeight * .4) act = s.id; });
  barra.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + act && !a.classList.contains("siempre")));
  indice.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + act));
  const fr = $("fraseTx"); if (fr) { const r = fr.getBoundingClientRect(), k = Math.min(1, Math.max(0, (innerHeight * .85 - r.top) / (r.height + innerHeight * .35))); const pals = fr.querySelectorAll(".pal"); pals.forEach((p, i) => p.classList.toggle("on", i < Math.ceil(k * pals.length))); }
}
addEventListener("scroll", alDesplazar, { passive: true }); alDesplazar();
if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll(".pal").forEach(p => p.classList.add("on"));
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visto"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" }) : null;
document.querySelectorAll(".rev").forEach(el => io ? io.observe(el) : el.classList.add("visto"));
addEventListener("beforeprint", () => { document.querySelectorAll(".rev").forEach(el => el.classList.add("visto")); document.querySelectorAll(".pal").forEach(p => p.classList.add("on")); });
</script>
