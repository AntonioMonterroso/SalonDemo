<style>
:root { --ease: cubic-bezier(0.23, 1, 0.32, 1); --r: 22px; --firma: #1C1A17; --gutter: 20px; --sombra: 0 1px 2px rgba(28,26,23,.04), 0 10px 32px rgba(28,26,23,.07); }

a { color: inherit; }

.serif, h1, h2, h3 { font-family: var(--f-titulo); font-weight: 400; letter-spacing: -.015em; line-height: 1.08; }
b, strong { font-weight: 600; }
.eyebrow { font: 500 11.5px/1.2 var(--f-texto); letter-spacing: .24em; text-transform: uppercase; color: var(--acento-texto); margin-bottom: 14px; }
.tx2 { color: var(--tinta2); } .tenue { color: var(--tenue); } .small { font-size: 13.5px; }
.cont { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); }
section, section.cont { padding-top: clamp(56px, 9vw, 110px); }
.rango output, .precio b, .grande { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1; }
h2 { font-size: clamp(32px, 4.6vw, 52px); }
h3 { font-size: 23px; }
.lead { font-size: clamp(17px, 1.7vw, 20px); color: var(--tinta2); max-width: 36em; margin-top: 16px; line-height: 1.55; }
.card { background: var(--tarjeta); border-radius: var(--r); box-shadow: var(--sombra); padding: 24px; }
.rev { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .8s var(--ease); transition-delay: calc(var(--i, 0) * 70ms); }
.rev.visto { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rev { transform: none; transition: opacity .3s linear; } .anillos circle { animation: none !important; stroke-dashoffset: 0 !important; } }

/* portada */
.portada { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 24px var(--gutter) 32px; max-width: 1120px; margin: 0 auto; }
.firma-top { display: flex; align-items: center; gap: 12px; }
.firma-m { width: 46px; height: 38px; object-fit: contain; mix-blend-mode: multiply; }
.firma-top b { display: block; font: 600 15px/1.15 var(--f-texto); letter-spacing: .02em; }
.firma-top small { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); }
.firma-top .fecha { margin-left: auto; text-align: right; }
.portada-c { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding: 40px 0; }
.portada h1 { font-size: clamp(40px, 5.8vw, 76px); letter-spacing: -.03em; line-height: 1.02; }
.portada h1 em { font-style: italic; color: var(--acento-texto); }
.sello { position: relative; display: grid; place-items: center; aspect-ratio: 1; max-width: 420px; width: 100%; justify-self: center; }
.anillos { position: absolute; inset: 0; width: 100%; height: 100%; }
.anillos circle { fill: none; stroke: var(--acento); stroke-dasharray: 100; stroke-dashoffset: 100; animation: trazo 2.2s var(--ease) forwards; }
.anillos circle:nth-child(2) { animation-delay: .3s; opacity: .6; } .anillos circle:nth-child(3) { animation-delay: .55s; opacity: .4; }
@keyframes trazo { to { stroke-dashoffset: 0; } }
.sello-in { width: 62%; display: grid; place-items: center; animation: aparece 1.1s .4s var(--ease) both; }
.sello-in svg { width: 100%; height: auto; }
.sello-in .generico { font: 500 clamp(30px, 4vw, 48px)/1.1 var(--f-titulo); text-align: center; }
@keyframes aparece { from { opacity: 0; transform: scale(.96); } }
.portada-pie { display: flex; gap: 12px 28px; flex-wrap: wrap; align-items: center; color: var(--tinta2); font-size: 14px; border-top: 1px solid var(--linea); padding-top: 18px; }
.portada-pie b { color: var(--tinta); }
@media (max-width: 820px) { .portada-c { grid-template-columns: 1fr; } .sello { max-width: 260px; order: -1; } }

/* problema */
.dolores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0; margin-top: 36px; border-top: 1px solid var(--linea); }
.dolor { padding: 24px 22px 26px 0; border-bottom: 1px solid var(--linea); }
.dolor span { font: 500 15px var(--f-titulo); color: var(--acento-texto); }
.dolor h3 { margin: 6px 0 8px; }

/* pantallas */
.pantalla { display: grid; grid-template-columns: 1fr 1.25fr; gap: clamp(24px, 4vw, 56px); align-items: center; margin-top: clamp(40px, 6vw, 72px); }
.pantalla.inv { grid-template-columns: 1.25fr 1fr; } .pantalla.inv .pt { order: 2; }
.pt ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.pt li { position: relative; padding-left: 26px; color: var(--tinta2); }
.pt li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 12px; height: 7px; border-left: 2px solid var(--acento-texto); border-bottom: 2px solid var(--acento-texto); transform: rotate(-45deg); }
.marco { border-radius: 18px; overflow: hidden; box-shadow: 0 2px 6px rgba(28,26,23,.06), 0 30px 70px rgba(28,26,23,.16); background: var(--tarjeta); border: 1px solid var(--linea); }
.marco img { width: 100%; height: auto; }
.telefonos { display: flex; gap: 16px; justify-content: center; align-items: flex-start; }
.tel { width: min(46%, 250px); border-radius: 34px; padding: 8px; background: #141210; box-shadow: 0 30px 60px rgba(28,26,23,.25); }
.tel img { border-radius: 27px; width: 100%; height: auto; }
.tel:nth-child(2) { margin-top: 40px; }
@media (max-width: 860px) { .pantalla, .pantalla.inv { grid-template-columns: 1fr; } .pantalla.inv .pt { order: 0; } }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--acento-suave); color: var(--acento-texto); font-size: 12.5px; font-weight: 700; }

/* comparativa */
.tabla-env { margin-top: 28px; background: var(--tarjeta); border-radius: var(--r); box-shadow: var(--sombra); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 640px; }
th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
thead th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
th.nos, td.nos { background: color-mix(in srgb, var(--acento-suave) 60%, transparent); font-weight: 700; color: var(--tinta); }
tbody th { font-weight: 600; color: var(--tinta2); }
.si { color: #3F7D5C; font-weight: 700; } .no { color: #B23A3A; }
.nota { font-size: 12.5px; color: var(--tenue); margin-top: 10px; }

/* calculadora */
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
.calc .card { display: grid; gap: 22px; align-content: start; }
.rango label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.rango output { font: 500 22px var(--f-titulo); color: var(--acento-texto); }
input[type=range] { width: 100%; accent-color: var(--oscuro); height: 28px; }
.resultado { background: var(--oscuro); color: var(--fondo); }
.resultado .grande { font: 500 clamp(44px, 6vw, 64px)/1 var(--f-titulo); letter-spacing: -.02em; }
.resultado .tx2, .resultado .tenue { color: color-mix(in srgb, var(--fondo) 70%, transparent); }
.res-fila { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 15px; }
.res-fila b { font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .calc { grid-template-columns: 1fr; } }

/* paquetes */
.iva { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--tinta) 7%, transparent); margin-top: 20px; }
.iva button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font: 600 13.5px var(--f-texto); color: var(--tinta2); cursor: pointer; transition: background-color .2s var(--ease), transform .16s var(--ease); }
.iva button:active { transform: scale(.97); }
.iva button.on { background: var(--tarjeta); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.paquetes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; align-items: stretch; }
.paq { display: flex; flex-direction: column; gap: 14px; position: relative; }
.paq.top { background: var(--oscuro); color: var(--fondo); transform: translateY(-10px); box-shadow: 0 30px 70px rgba(28,26,23,.25); }
.paq.top .tx2, .paq.top .tenue, .paq.top li { color: color-mix(in srgb, var(--fondo) 78%, transparent); }
.paq.top li::before { border-color: var(--acento); }
.paq .reco { position: absolute; top: -12px; left: 24px; background: var(--acento); color: var(--acento-sobre); font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; }
.precio b { font: 500 42px/1 var(--f-titulo); letter-spacing: -.02em; }
.precio small { font-size: 14px; }
.activ { font-size: 14px; }
.paq ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 9px; font-size: 14.5px; }
.paq li { position: relative; padding-left: 24px; color: var(--tinta2); }
.paq li::before { content: ""; position: absolute; left: 2px; top: .5em; width: 11px; height: 6px; border-left: 2px solid var(--acento-texto); border-bottom: 2px solid var(--acento-texto); transform: rotate(-45deg); }
.paq li.mas { font-weight: 700; color: inherit; padding-left: 0; } .paq li.mas::before { display: none; }
.paquetes.dos { grid-template-columns: repeat(2, 1fr); margin-top: 18px; }
.paq.extra .chip { align-self: flex-start; }
.combo { margin-top: 26px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: center; border: 2px solid var(--acento); background: linear-gradient(135deg, var(--tarjeta), var(--acento-suave)); }
.reco-l { display: inline-block; background: var(--acento); color: var(--acento-sobre); font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; }
.combo-p { text-align: right; } .combo-p s { margin-left: 6px; }
@media (max-width: 760px) { .combo { grid-template-columns: 1fr; } .combo-p { text-align: left; } .paquetes.dos { grid-template-columns: 1fr; } }
.compra { margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
@media (max-width: 900px) { .paquetes { grid-template-columns: 1fr; } .paq.top { transform: none; } .compra { grid-template-columns: 1fr; } }

/* incluye / cronograma */
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 28px; }
.lista-l { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.lista-l li { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--linea); padding-bottom: 10px; color: var(--tinta2); }
.lista-l li b { color: var(--tinta); white-space: nowrap; }
.pasos { counter-reset: p; display: grid; gap: 14px; margin-top: 12px; }
.paso { display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.paso::before { counter-increment: p; content: counter(p); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--acento-suave); color: var(--acento-texto); font: 600 18px var(--f-titulo); }

/* dudas */
details { border-bottom: 1px solid var(--linea); padding: 18px 0; }
summary { cursor: pointer; font: 500 20px/1.3 var(--f-titulo); list-style: none; display: flex; justify-content: space-between; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 400 24px var(--f-texto); color: var(--acento-texto); transition: transform .25s var(--ease); }
details[open] summary::after { transform: rotate(45deg); }
details p { color: var(--tinta2); margin-top: 10px; max-width: 46em; }

/* cierre */
.cierre { margin-top: clamp(56px, 9vw, 110px); background: var(--oscuro); color: var(--fondo); border-radius: 36px; padding: clamp(32px, 6vw, 72px); display: grid; grid-template-columns: 1.2fr .8fr; gap: 32px; align-items: center; }
.cierre .tx2 { color: color-mix(in srgb, var(--fondo) 72%, transparent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 28px; border-radius: 999px; font-weight: 700; font-size: 16px; text-decoration: none; transition: transform .16s var(--ease), background-color .2s var(--ease); }
.btn:active { transform: scale(.97); }
.btn-a { background: var(--acento); color: var(--acento-sobre); }
.btn-s { box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: var(--fondo); }
@media (hover: hover) and (pointer: fine) { .btn-a:hover { background: color-mix(in srgb, var(--acento) 88%, #fff); } }
.firmas { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 56px; }
.firmas div { border-top: 1px solid var(--tinta); padding-top: 8px; font-size: 13px; color: var(--tenue); }
.pie { display: flex; align-items: center; gap: 12px; padding: 40px 0 48px; color: var(--tenue); font-size: 13px; flex-wrap: wrap; }
@media (max-width: 760px) { .cierre { grid-template-columns: 1fr; } .firmas { grid-template-columns: 1fr; } }

@media print {
  @page { size: letter; margin: 14mm; }
  body { background: #fff; font-size: 12.5px; }
  .rev { opacity: 1 !important; transform: none !important; }
  .portada { min-height: auto; page-break-after: always; }
  section, section.cont { padding-top: 26px; }
  .pantalla, .paq, .calc, .tabla-env, .cierre { page-break-inside: avoid; }
  .no-print, .iva { display: none !important; }
  .card, .marco, .tel { box-shadow: none !important; }
  .card { border: 1px solid var(--linea); }
  .paq.top { transform: none; }
  .anillos circle { animation: none; stroke-dashoffset: 0; }
  .cierre, .resultado, .paq.top { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* barra fija */
.barra-top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transform: translateY(-105%); transition: transform .45s var(--ease); background: color-mix(in srgb, var(--fondo) 84%, transparent); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); border-bottom: 1px solid var(--linea); }
.barra-top.on { transform: none; }
.barra-in { max-width: 1120px; margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; min-height: 58px; }
.barra-in .firma-m { width: 34px; height: 28px; }
.barra-in > b { font: 600 14px var(--f-texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.barra-in nav { display: flex; gap: 2px; margin-left: auto; }
.barra-in nav a { padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--tinta2); text-decoration: none; white-space: nowrap; transition: background-color .2s var(--ease), color .2s var(--ease); }
.barra-in nav a.on { background: var(--tarjeta); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.barra-in nav a.siempre { background: var(--oscuro); color: var(--fondo); }
.progreso { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acento); transform-origin: left; transform: scaleX(0); }
.btn-ic { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--tinta) 6%, transparent); color: var(--tinta); cursor: pointer; flex: none; transition: transform .16s var(--ease), background-color .2s var(--ease); }
.btn-ic:active { transform: scale(.94); }
.btn-ic svg { width: 18px; height: 18px; }
@media (max-width: 900px) { .barra-in nav a:not(.siempre) { display: none; } }
@media (max-width: 560px) { .firma-top .fecha { display: none; } }
@media (hover: hover) and (pointer: fine) { .barra-in nav a:not(.siempre):hover { color: var(--tinta); } }
.aviso { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; background: var(--oscuro); color: var(--fondo); padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14.5px; transition: opacity .25s var(--ease), transform .35s var(--ease); z-index: 60; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
.aviso.on { opacity: 1; transform: translate(-50%, 0); }

/* abanico de muestras */
.abanico { display: grid; gap: 14px; justify-items: center; }
.abanico svg { width: 100%; max-width: 520px; height: auto; overflow: visible; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.punta { cursor: pointer; outline: none; }
.sel-aro { opacity: 0; transition: opacity .25s var(--ease); }
.punta.sel .sel-aro, .punta:focus-visible .sel-aro { opacity: 1; }
.tonos { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 480px; }
.tono { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), inset 0 -4px 8px rgba(0,0,0,.12), inset 0 4px 8px rgba(255,255,255,.35); transition: transform .16s var(--ease), box-shadow .2s var(--ease); }
.tono:active { transform: scale(.88); }
.tono.on { box-shadow: 0 0 0 2px var(--fondo), 0 0 0 4px var(--tinta); }
.acabados { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 520px; }
.acab { border: 0; padding: 7px 11px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 6%, transparent); font: 600 13px var(--f-texto); color: var(--tinta2); cursor: pointer; transition: background-color .2s var(--ease), color .2s var(--ease), transform .16s var(--ease); }
.acab.on { background: var(--oscuro); color: var(--fondo); }
.acab:active { transform: scale(.96); }
.abanico-tx { font-size: 13.5px; color: var(--tenue); text-align: center; min-height: 22px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.abanico-tx b { color: var(--tinta); }
.abanico-tx button { border: 0; background: none; color: var(--acento-texto); font: 700 13px var(--f-texto); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* demo en vivo */
.demo-vivo { display: grid; grid-template-columns: .95fr 1.05fr; gap: clamp(24px, 4vw, 56px); align-items: center; margin-top: 30px; }
.demo-tabs { display: grid; gap: 10px; }
.demo-tab { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 18px; border: 0; background: var(--tarjeta); box-shadow: var(--sombra); cursor: pointer; font: inherit; color: inherit; transition: box-shadow .2s var(--ease), transform .16s var(--ease); }
.demo-tab.on { box-shadow: 0 0 0 2px var(--tinta), var(--sombra); }
.demo-tab:active { transform: scale(.98); }
.demo-tab b { display: block; } .demo-tab small { color: var(--tenue); font-size: 13px; }
.demo-tab .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--acento-suave); color: var(--acento-texto); font: 600 16px var(--f-titulo); flex: none; }
.demo-tab.on .n { background: var(--oscuro); color: var(--fondo); }
.iphone { justify-self: center; width: 336px; height: 700px; border-radius: 54px; padding: 11px; background: linear-gradient(145deg, #2b2b2b, #0d0d0d); box-shadow: 0 0 0 1.5px #3a3a3a, 0 40px 90px rgba(0,0,0,.32); position: relative; }
.iphone .scr { height: 100%; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; background: var(--fondo); }

<body>
<div id="raiz"></div>
<script>
"use strict";
const P = window.PARA, M = window.MARCA;
const CLIENTE = P.generico ? "tu salón" : M.nombre;
const WA_FIRMA = "50237645139";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const Q = n => "Q" + Math.round(n).toLocaleString("en-US");
const hoy = new Date(), vence = new Date(hoy.getTime() + 15 * 864e5);
const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fecha = d => d.getDate() + " de " + MES[d.getMonth()] + " de " + d.getFullYear();
document.title = "Propuesta · " + (P.generico ? "Sistema para salones de belleza" : M.nombre);

const PAQ = [
  { id: "esencial", nombre: "Esencial", activ: 2500, mes: 750, desc: "Para empezar a recibir citas en línea sin perder ninguna.", items: ["Página del salón con servicios y precios", "Reserva en línea las 24 horas", "Pase de cita con QR: confirmar, mover o cancelar", "Recordatorio de mañana por WhatsApp con un toque", "Agenda del día por estilista", "Ficha de clientas con historial", "Hasta 4 personas en el equipo", "Tarjeta de puntos: se agrega aparte"] },
  { id: "boutique", nombre: "Boutique", activ: 6500, mes: 1500, desc: "Todo el salón en un solo lugar. Lo que viste en la demo.", items: ["<b>Todo lo de Esencial, y además:</b>", "Estudio de diseño de uñas conectado a la cita", "Recepción en vivo: llegadas, espera, en servicio y por cobrar", "Cobro con propina, efectivo con cambio, transferencia y link", "Caja diaria con cuadre", "Ficha de belleza: fórmulas de color, pestañas, antes y después, firma", "Comisiones y pago del equipo", "Inventario que se descuenta solo", "Paquetes, membresías, tarjetas de regalo y puntos", "Reportes y exportar a Excel", "Pantalla para la TV de la sala", "Tarjeta de puntos web incluida", "Hasta 10 personas en el equipo"] },
  { id: "signature", nombre: "Signature", activ: 12000, mes: 2500, desde: true, desc: "Para salones con más de una sede o mucho volumen.", items: ["<b>Todo lo de Boutique, y además:</b>", "Pagos reales con tarjeta (Recurrente, BAC, NeoNet u otra)", "WhatsApp automático con la API oficial", "Varias sucursales", "Tablet de llegada para la clienta", "Tarjeta en Apple Wallet y Google Wallet incluida", "Equipo sin límite", "Capacitación en el salón"] }
];
const EXTRA = [
  { id: "web", nombre: "Tarjeta de puntos web", activ: 1200, mes: 150, nota: "Incluida en Boutique y Signature", items: ["Sellos y puntos con la marca del salón", "Cada clienta recibe su link y su QR", "Se guarda en la pantalla de inicio del teléfono", "Recepción suma el sello al cobrar", "Premio y número de sellos a tu gusto"] },
  { id: "wallet", nombre: "Apple Wallet + Google Wallet", activ: 2800, mes: 300, nota: "Requiere la tarjeta web · incluida en Signature", items: ["La tarjeta vive en la cartera del teléfono", "Se actualiza sola con cada sello", "Aviso en la pantalla bloqueada: «te falta un sello»", "QR para escanear en recepción", "iPhone y Android"] }
];

let IVA = false;

function comboHTML() {

/* ---------- abanico de muestras de uñas ---------- */
const TONOS = [["Rosa chicle", "#EE8FB1"], ["Coral", "#EE7B66"], ["Rojo clásico", "#B3132C"], ["Vino", "#5C1A2B"], ["Lila", "#C9B6E4"], ["Nude rosado", "#E8C3B9"], ["Champán", "#D8C3A5"], ["Blanco", "#FBFBF9"], ["Negro", "#141414"], ["Azul marino", "#1F2A4D"], ["Salvia", "#9CAF95"], ["Oro", "#C9A24A"]];
const ACAB = [["brillo", "Brillo"], ["mate", "Mate"], ["glitter", "Glitter"], ["cromado", "Cromado"], ["frances", "Francés"], ["ojo", "Ojo de gato"]];
const ANG = [-56, -37, -18.5, 0, 18.5, 37, 56];
const UN = ["#EE8FB1", "#EE7B66", "#B3132C", "#5C1A2B", "#C9B6E4", "#E8C3B9", "#D8C3A5"].map((c, i) => ({ c, a: i === 4 ? "glitter" : i === 6 ? "frances" : "brillo" }));
let SEL = null;
const angAct = ANG.map(() => 0), angObj = ANG.map(() => 0), alzAct = ANG.map(() => 0);
const NH = 116, PUNTA = `M-30 0 L-30-58 C-30-95-11-${NH} 0-${NH} C11-${NH} 30-95 30-58 L30 0 Q0 8-30 0Z`;
function puntaSVG(u, i) {
  let c = "";

  if (u.a === "cromado") c += `<rect x="-31" y="-${NH + 2}" width="62" height="${NH + 12}" fill="url(#ab-crom)"/>`;
  if (u.a === "ojo") c += `<rect x="-31" y="-${NH + 2}" width="62" height="${NH + 12}" fill="url(#ab-ojo)"/>`;
  c += `<rect x="-31" y="-${NH + 2}" width="62" height="${NH + 12}" fill="url(#ab-somb)"/>`;
  c += u.a === "mate" ? `<rect x="-31" y="-${NH + 2}" width="62" height="${NH + 12}" fill="#fff" opacity=".07"/>` : `<path d="M-16-16 C-19-50-16-80-7-98" stroke="#fff" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="${u.a === "cromado" ? .8 : .5}"/><circle cx="12" cy="-88" r="3.2" fill="#fff" opacity=".5"/>`;
  return `<g class="punta ${SEL === i ? "sel" : ""}" data-i="${i}" tabindex="0" role="button" aria-label="Uña ${i + 1}: ${tonoNombre(u.c)}">
    <rect x="-3.5" y="-212" width="7" height="212" rx="3.5" fill="url(#ab-var)"/>
    <g transform="translate(0 -206)"><clipPath id="ab-c${i}"><path d="${PUNTA}"/></clipPath>
      <path d="${PUNTA}" fill="${u.c}" filter="url(#ab-sombra)"/><g clip-path="url(#ab-c${i})">${c}</g>
      <path d="${PUNTA}" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="1"/>
      <path class="sel-aro" d="${PUNTA}" fill="none" stroke="var(--tinta)" stroke-width="2.4" transform="translate(0 4) scale(1.1)"/></g></g>`;
}
const tonoNombre = hex => (TONOS.find(t => t[1].toLowerCase() === String(hex).toLowerCase()) || ["Color a tu gusto"])[0];
function abanicoSVG() {
  const lg = M.logoSVG ? M.logoSVG(76, false).replace("<svg ", '<svg x="-38" y="-38" ') : `<text y="9" text-anchor="middle" font-family="var(--f-titulo)" font-size="26" fill="var(--tinta)">${esc(M.monograma || "")}</text>`;
  return `<svg viewBox="-300 -352 600 410" id="abSVG" role="group" aria-label="Abanico de muestras de uñas">
    <defs>
      <linearGradient id="ab-var" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8963A"/><stop offset=".5" stop-color="#EAD38C"/><stop offset="1" stop-color="#A6842C"/></linearGradient>
      <linearGradient id="ab-somb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".22" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
      <linearGradient id="ab-crom" x1="0" y1="0" x2="1" y2="1"><stop offset=".1" stop-color="#fff" stop-opacity=".1"/><stop offset=".32" stop-color="#fff" stop-opacity=".8"/><stop offset=".46" stop-color="#fff" stop-opacity=".05"/><stop offset=".66" stop-color="#fff" stop-opacity=".55"/><stop offset=".88" stop-color="#E9D9FF" stop-opacity=".2"/></linearGradient>
      <linearGradient id="ab-ojo" x1="0" y1="1" x2="1" y2="0"><stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <pattern id="ab-glit" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(23)"><circle cx="1" cy="1.5" r=".55" fill="#fff"/><circle cx="5.5" cy="2.6" r=".42" fill="#F7E3A1"/><circle cx="3.2" cy="6.4" r=".5" fill="#fff" opacity=".85"/><circle cx="7.6" cy="7.3" r=".35" fill="#E9D9FF"/><circle cx="8.1" cy="4.2" r=".3" fill="#fff" opacity=".7"/><circle cx="1.9" cy="8.4" r=".28" fill="#F7E3A1"/></pattern>
      <filter id="ab-sombra" x="-40%" y="-20%" width="180%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2A1A10" flood-opacity=".22"/></filter>
    </defs>
    <g id="abPuntas"></g>
    <circle r="50" fill="var(--tarjeta)" stroke="url(#ab-var)" stroke-width="3" filter="url(#ab-sombra)"/>${lg}
  </svg>`;
}
function pintarAbanico() {
  const g = document.getElementById("abPuntas"); if (!g) return;
  const orden = UN.map((u, i) => i).sort((a, b) => (a === SEL) - (b === SEL));
  g.innerHTML = orden.map(i => puntaSVG(UN[i], i)).join("");
  aplicarAngulos();
  const tx = document.getElementById("abTx");
  tx.innerHTML = SEL === null ? `<span>Toca una uña y escoge el color. <b>Así diseñan sus clientas.</b></span>` : `<span><b>Uña ${SEL + 1}</b> · ${tonoNombre(UN[SEL].c)} · ${ACAB.find(x => x[0] === UN[SEL].a)[1]}</span><button data-todas>Todas</button>`;
  const obj = SEL === null ? UN : [UN[SEL]];
  document.getElementById("tonos").innerHTML = TONOS.map(([n, c]) => `<button class="tono ${obj.every(u => u.c === c) ? "on" : ""}" style="--c:${c}" data-tono="${c}" aria-label="${n}" title="${n}"></button>`).join("");

function aplicarAngulos() {
  document.querySelectorAll("#abPuntas .punta").forEach(el => { const i = +el.dataset.i; el.setAttribute("transform", `rotate(${angAct[i].toFixed(2)}) translate(0 ${(-alzAct[i]).toFixed(2)})`); });
}
let animando = false;
function animarAbanico() {
  if (animando) return; animando = true;
  const paso = () => {
    let mov = false;
    ANG.forEach((_, i) => {
      const da = angObj[i] - angAct[i], alz = SEL === i ? 18 : 0, dz = alz - alzAct[i];
      if (Math.abs(da) > .05 || Math.abs(dz) > .05) mov = true;
      angAct[i] += da * .14; alzAct[i] += dz * .2;
    });
    aplicarAngulos();
    if (mov) requestAnimationFrame(paso); else { animando = false; ANG.forEach((_, i) => { angAct[i] = angObj[i]; }); aplicarAngulos(); }
  };
  requestAnimationFrame(paso);
}
function abrirAbanico() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { ANG.forEach((a, i) => { angAct[i] = angObj[i] = a; }); aplicarAngulos(); return; }
  ANG.forEach((a, i) => setTimeout(() => { angObj[i] = a; animarAbanico(); }, 250 + Math.abs(i - 3) * 70));

/* ---------- demo en vivo ---------- */
const DEMO_TABS = [["#/", "La página del salón", "Servicios, trabajos y horario"], ["#/reservar", "Reservar una cita", "Tres pasos, sin crear cuenta"], ["#/disenar/preset/aura-rosa", "Diseñar sus uñas", "Forma, color, francés y cristales"], ["tarjeta", "Su tarjeta de puntos", "Sellos y Apple o Google Wallet"]];

/* ---------- arma tu plan ---------- */
const PL = { paq: P.recomendado || "boutique", web: !P.generico, wallet: false, dominio: false };
function calcPlan() {
  const pq = PAQ.find(x => x.id === PL.paq), lin = [[pq.nombre, pq.activ, pq.mes]];
  const webInc = PL.paq !== "esencial", walInc = PL.paq === "signature";

  if (web && !webInc) { lin.push(["Tarjeta de puntos web", 1200, 150]); if (PL.paq === "esencial") lin.push(["Descuento de arranque", -500, 0]); }
  if (PL.wallet && !walInc) lin.push(["Apple Wallet + Google Wallet", 2800, 300]);

  const activ = lin.reduce((s, l) => s + l[1], 0), mes = lin.reduce((s, l) => s + l[2], 0);
  return { lin, activ: conIva(activ), mes: conIva(mes), webInc, walInc, web, pq };
}
function planHTML() {
  const r = calcPlan(), op = (k, t, sub, precio, on, dis) => `<label class="op"><span class="tx"><b>${t}</b><small>${sub}</small></span><span class="precio-op">${precio}</span><span class="sw"><input type="checkbox" data-op="${k}" ${on ? "checked" : ""} ${dis ? "disabled" : ""} aria-label="${t}"><span></span></span></label>`;
  return `<div class="plan-op">

      ${op("web", "Tarjeta de puntos web", r.webInc ? "Incluida en " + r.pq.nombre : "Sellos y puntos con link y QR", r.webInc ? "Incluida" : `+${Q(conIva(150))}<small>/mes</small>`, r.web, r.webInc || (PL.wallet && !r.walInc))}
      ${op("wallet", "Apple Wallet + Google Wallet", r.walInc ? "Incluida en Signature" : "La tarjeta en la cartera del teléfono · US$99/año de Apple aparte", r.walInc ? "Incluida" : `+${Q(conIva(300))}<small>/mes</small>`, r.walInc || PL.wallet, r.walInc)}
      ${op("dominio", "Dominio propio", "Tu dirección .com · ≈ Q85 al año al registrador", `+${Q(conIva(250))}<small> una vez</small>`, PL.dominio, false)}
      ${op("iva", "Mostrar con IVA (12 %)", "Para facturar con IVA", "", IVA, false)}
    </div>
    <div class="card total">
      <p class="tenue small">Mensualidad</p><p class="grande">${Q(r.mes)}</p>
      <p class="tenue small" style="margin-bottom:10px">Activación única: <b style="color:var(--fondo)">${Q(r.activ)}</b>${PL.paq === "signature" ? " · desde" : ""}</p>
      ${r.lin.map(l => `<div class="lin"><span>${l[0]}</span><b>${l[1] < 0 ? "−" + Q(conIva(-l[1])) : Q(conIva(l[1]))}${l[2] ? " + " + Q(conIva(l[2])) + "/mes" : ""}</b></div>`).join("")}
      <div class="lin"><span>Primer año en total</span><b>${Q(r.activ + r.mes * 12)}</b></div>
      <div class="acciones"><a class="btn btn-a" target="_blank" rel="noopener" href="https://wa.me/${WA_FIRMA}?text=${encodeURIComponent(textoPlan(r))}">Lo quiero así</a><button class="btn btn-l" data-copiar>Copiar resumen</button></div>
    </div>`;
}
function textoPlan(r) {
  return `Hola Antonio, me interesa el sistema para ${P.generico ? "mi salón" : M.nombre}:\n` + r.lin.map(l => `• ${l[0]}`).join("\n") + `\nActivación: ${Q(r.activ)} · Mensualidad: ${Q(r.mes)} (${IVA ? "con IVA" : "sin IVA"}).`;

function aviso(t) { let a = document.querySelector(".aviso"); if (!a) { a = document.createElement("div"); a.className = "aviso"; a.setAttribute("role", "status"); document.body.appendChild(a); } a.textContent = t; a.classList.add("on"); clearTimeout(aviso._t); aviso._t = setTimeout(() => a.classList.remove("on"), 2200); }
async function compartir() {

  try { if (navigator.share) { await navigator.share(d); return; } await navigator.clipboard.writeText(location.href); aviso("Link copiado"); } catch (e) { if (e && e.name !== "AbortError") aviso("No se pudo compartir"); }
}

function svgAnillos() { return `<svg class="anillos" viewBox="0 0 200 200" aria-hidden="true"><circle pathLength="100" cx="100" cy="100" r="96" stroke-width=".9"/><circle pathLength="100" cx="103" cy="97" r="90" stroke-width=".6"/><circle pathLength="100" cx="97" cy="103" r="86" stroke-width=".5"/></svg>`; }
function logoCliente() {

/* calculadora */
const $ = id => document.getElementById(id);
function calcular() {
  const f = +$("cFaltas").value, t = +$("cTicket").value, m = +$("cMsj").value;
  const perdida = f * t * 4.33, recupera = perdida * .5, horas = Math.round(m * 2 * 26 / 60), costo = conIva(P.generico ? 1500 : COMBO.mes);
  $("rCostoN").textContent = P.generico ? "Paquete Boutique al mes" : "Esencial + tarjeta al mes";
  $("oFaltas").textContent = f; $("oTicket").textContent = Q(t); $("oMsj").textContent = m;
  $("rPerdida").textContent = Q(perdida); $("rRecupera").textContent = Q(recupera); $("rHoras").textContent = horas + " h"; $("rCosto").textContent = Q(costo);
  const n = t ? Math.ceil(costo / t) : 0; $("rPaga").textContent = n + (n === 1 ? " falta evitada" : " faltas evitadas");
}
["cFaltas", "cTicket", "cMsj"].forEach(id => $(id).addEventListener("input", calcular));
calcular();
function refrescar() {
  document.querySelectorAll("[data-iva]").forEach(x => x.classList.toggle("on", (x.dataset.iva === "1") === IVA));
  $("paquetesBox").innerHTML = paquetesHTML(); $("extrasBox").innerHTML = extrasHTML(); $("comboBox").innerHTML = comboHTML(); $("compraP").textContent = Q(conIva(28000)) + " – " + Q(conIva(35000)); $("compraM").textContent = "+ " + Q(conIva(600)) + " al mes de mantenimiento"; calcular();
  $("planBox").innerHTML = planHTML();
}
document.querySelectorAll("[data-iva]").forEach(b => b.addEventListener("click", () => { IVA = b.dataset.iva === "1"; refrescar(); }));
$("planBox").innerHTML = planHTML();
$("planBox").addEventListener("click", e => {
  const b = e.target.closest("[data-paq]"); if (b) { PL.paq = b.dataset.paq; $("planBox").innerHTML = planHTML(); return; }
  if (e.target.closest("[data-copiar]")) { navigator.clipboard && navigator.clipboard.writeText(textoPlan(calcPlan())).then(() => aviso("Resumen copiado"), () => aviso("No se pudo copiar")); }
});
$("planBox").addEventListener("change", e => {
  const k = e.target.dataset.op; if (!k) return;
  if (k === "iva") { IVA = e.target.checked; refrescar(); return; }
  PL[k] = e.target.checked; $("planBox").innerHTML = planHTML();
});
/* abanico */
pintarAbanico(); abrirAbanico();
$("abanico").addEventListener("click", e => {
  const p = e.target.closest(".punta"); if (p) { const i = +p.dataset.i; SEL = SEL === i ? null : i; pintarAbanico(); animarAbanico(); return; }
  const t = e.target.closest("[data-tono]"); if (t) { (SEL === null ? UN : [UN[SEL]]).forEach(u => u.c = t.dataset.tono); pintarAbanico(); return; }
  const a = e.target.closest("[data-acab]"); if (a) { (SEL === null ? UN : [UN[SEL]]).forEach(u => u.a = a.dataset.acab); pintarAbanico(); return; }
  if (e.target.closest("[data-todas]")) { SEL = null; pintarAbanico(); animarAbanico(); }
});
$("abanico").addEventListener("keydown", e => { const p = e.target.closest(".punta"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); p.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
/* demo en vivo */
$("demoTabs").addEventListener("click", e => {
  const b = e.target.closest(".demo-tab"); if (!b) return;
  document.querySelectorAll(".demo-tab").forEach(x => x.classList.toggle("on", x === b));
  const f = $("demoFrame"), v = b.dataset.v;
  try {
    const w = f.contentWindow;
    if (v === "tarjeta") { const d = JSON.parse(localStorage.getItem(M.clave + ".datos")); const k = d.clientas.filter(x => x.tarjeta && x.sellos >= 3).sort((a, c) => c.sellos - a.sellos)[0]; w.location.hash = "#/tarjeta/" + k.tarjeta; }
    else w.location.hash = v;
  } catch (err) { f.src = "index.html" + (v === "tarjeta" ? "#/" : v); }
});
/* compartir */
document.addEventListener("click", e => { if (e.target.closest("[data-compartir]")) compartir(); });
/* barra fija, avance y sección activa */
const barra = $("barraTop"), prog = $("progreso"), portada = document.querySelector(".portada");
function alDesplazar() {
  const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
  barra.classList.toggle("on", y > portada.offsetHeight * .7);
  prog.style.transform = `scaleX(${h > 0 ? Math.min(1, y / h) : 0})`;
  let act = null; document.querySelectorAll("main section[id]").forEach(s => { if (s.getBoundingClientRect().top < innerHeight * .4) act = s.id; });
  barra.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + act && !a.classList.contains("siempre")));
}
addEventListener("scroll", alDesplazar, { passive: true }); alDesplazar();
/* aparecer al bajar */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visto"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" }) : null;
document.querySelectorAll(".rev").forEach(el => io ? io.observe(el) : el.classList.add("visto"));
window.addEventListener("beforeprint", () => document.querySelectorAll(".rev").forEach(el => el.classList.add("visto")));
</script>
